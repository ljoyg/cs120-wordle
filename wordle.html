<!doctype html>
<html>
<head>
<link rel="stylesheet" href="styles.css">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WORDLE</title>
</head>

<body>
    <script>
        window.onload = function() {
            game = {
                answer: selectAnswer(),
                currGuess: 0,
                nextGuess() {
                    this.currGuess += 1;
                }
            }

            function createBoard() {
                boardElements = ""
                for (i = 0; i < 6; i++) {
                    boardElements += "<tr id='guess" + i + "'> \
                                        <td id='letter1' class='letter1'>&nbsp;</td> \
                                        <td id='letter2' class='letter2'>&nbsp;</td> \
                                        <td id='letter3' class='letter3'>&nbsp;</td> \
                                        <td id='letter4' class='letter4'>&nbsp;</td> \
                                        <td id='letter5' class='letter5'>&nbsp;</td> \
                                    </tr>"
                }
                document.getElementById("board").innerHTML = boardElements;
            }

            function createLetterTable() {
                tableElements = '<tr id="q-d"> \
                                    <td id="Q">Q</td> \
                                    <td id="W">W</td> \
                                    <td id="E">E</td> \
                                    <td id="R">R</td> \
                                    <td id="T">T</td> \
                                    <td id="Y">Y</td> \
                                    <td id="U">U</td> \
                                    <td id="I">I</td> \
                                    <td id="O">O</td> \
                                    <td id="P">P</td> \
                                    <td id="A">A</td> \
                                    <td id="S">S</td> \
                                    <td id="D">D</td> \
                                </tr> \
                                <tr id="f-m"> \
                                    <td id="F">F</td> \
                                    <td id="G">G</td> \
                                    <td id="H">H</td> \
                                    <td id="J">J</td> \
                                    <td id="K">K</td> \
                                    <td id="L">L</td> \
                                    <td id="Z">Z</td> \
                                    <td id="X">X</td> \
                                    <td id="C">C</td> \
                                    <td id="V">V</td> \
                                    <td id="B">B</td> \
                                    <td id="N">N</td> \
                                    <td id="M">M</td> \
                                </tr>'
                document.getElementById("letter-table").innerHTML = tableElements;
            }

            function selectAnswer() {
                answer = fetch("https://random-word-api.herokuapp.com/word?length=5")
                // .then(res => res.text())
                console.log(answer);
                return "ALLOW";
            }

            createBoard();
            createLetterTable();

            document.getElementById("checkAnswer").onclick = checkAnswer;
            document.getElementById("restart-button").onclick = restart;

            function checkAnswer() {
                guess = document.getElementById("user-guess").value.toUpperCase();
                document.getElementById("user-guess").value = "";
                if (guess.length != 5 && guess.length != 0) {
                    alert("Your guess must be 5 letters!")
                    return;
                }
                handleGuess(guess);
            }

            function handleGuess(guess) {
                boxes = document.getElementById("guess" + game.currGuess).children;
                if (guess) {
                    answerArr = game.answer.split('');
                    guess.split('').forEach(function(char, i) {
                        boxes[i].innerHTML = char;
                        if (answerArr[i] == char) {
                            boxes[i].classList.add("correct");
                            answerArr[i] = 0;
                            document.getElementById(char).classList.remove("included");
                            document.getElementById(char).classList.add("correct");
                        } else if (answerArr.includes(char)) {
                            boxes[i].classList.add("included");
                            answerArr[answerArr.indexOf(char)] = 0;
                            if (!document.getElementById(char).classList.contains("correct")) {
                                document.getElementById(char).classList.add("included");
                            }
                        } else {
                            boxes[i].classList.add("incorrect");
                            document.getElementById(char).classList.add("incorrect");
                        }
                    });
                }
                if (guess == game.answer) {
                    win();
                    allowRestart();
                }
                game.nextGuess();
                if (game.currGuess >= 6) {
                    lose();
                }
            }

            const lose = () => alert("Game Over! The correct answer was: " + game.answer);
            const win = () => alert("Congratulations! You correctly guessed the word: " + game.answer); 

            function allowRestart() {
                document.getElementById("user-guess").classList.toggle("hidden");
                document.getElementById("checkAnswer").classList.toggle("hidden");
                document.getElementById("restart-button").classList.toggle("hidden");
            }

            function restart() {
                document.getElementById("user-guess").classList.toggle("hidden");
                document.getElementById("checkAnswer").classList.toggle("hidden");
                document.getElementById("restart-button").classList.toggle("hidden");
                game.answer = selectAnswer();
                game.currGuess = 0;
                document.getElementById("board").innerHTML = "";
                createBoard();
                createLetterTable();
            }
        }
    </script>
    <h1>WORDLE</h1>
    <div id='game' class='game'>
        <table id="board" class="board" style="width: 100%; border-collapse: separate;">
        </table>
        <input type="text" id="user-guess"/>
        <button id="checkAnswer">Check Answer</button>
        <button id="restart-button" class="hidden">New Game</button>
        <div id="letter-board" class="letter-board">
            <table id="letter-table" class="letter-table">
            </table>
        </div>
    </div>
</body>
</html>
