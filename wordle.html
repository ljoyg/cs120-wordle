<!doctype html>
<html>
<head>
<link rel="stylesheet" href="styles.css">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WORDLE</title>
</head>

<body>
    <script>
        window.onload = function() {
            function createBoard() {
                boardElements = ""
                for (i = 0; i < 6; i++) {
                    boardElements += "<tr id='guess" + i + "'> \
                                        <td id='letter1' class='letter1'>&nbsp;</td> \
                                        <td id='letter2' class='letter2'>&nbsp;</td> \
                                        <td id='letter3' class='letter3'>&nbsp;</td> \
                                        <td id='letter4' class='letter4'>&nbsp;</td> \
                                        <td id='letter5' class='letter5'>&nbsp;</td> \
                                    </tr>"
                }
                document.getElementById("board").innerHTML = boardElements;
            }

            function selectAnswer() {
                console.log("GAZED");
                return "GAZED";
            }

            createBoard();
            actual = selectAnswer();
            currGuess = 0;

            document.getElementById("checkAnswer").onclick = checkAnswer;

            function checkAnswer() {
                guess = document.getElementById("user-guess").value.toUpperCase();
                // console.log(guess);
                document.getElementById("user-guess").value = "";
                if (guess.length != 5 && guess.length != 0) {
                    alert("Your guess must be 5 letters!")
                    return;
                }
                handleGuess(guess);
                // console.log("valid guess");
            }

            function handleGuess(guess) {
                boxes = document.getElementById("guess" + currGuess).children;
                if (guess) {
                    guess.split('').forEach(function(char, i) {
                        console.log(char);
                        boxes[i].innerHTML = char;
                    });
                }
                currGuess += 1;
            }
        }
    </script>
    <h1>WORDLE</h1>
    <div id='game' class='game'>
        <table id="board" style="width: 100%; border-collapse: separate;">
        </table>
        <input type="text" id="user-guess" class="user-guess"/>
        <button id="checkAnswer" class="checkAnswer">Check Answer</button>
    </div>
</body>
</html>
